name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # what Anki 26.x ships
      # annotate-failures: each failing test shows as an annotation on the run; timeout: a hang fails one test, not the job
      - run: python -m pip install pytest pytest-timeout pytest-github-actions-annotate-failures
      - run: python -m pytest -q -p no:cacheprovider --timeout=60 tests
